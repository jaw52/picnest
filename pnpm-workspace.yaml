# Only install versions published at least a day ago.
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - mygo-runtime

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@vercel/detect-agent@1.2.7'

shellEmulator: true

packages:
  - apps/desktop/frontend

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  agentic:
    '@antfu/skills': ^0.1.0
    skills-npm: ^4.1.0
  build:
    '@vitejs/plugin-vue': ^6.0.10
    unocss: ^66.11.0
    vite: ^8.3.4
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@types/node': ^26.6.5
    '@unocss/eslint-plugin': ^66.11.0
    eslint: ^10.13.0
    eslint-plugin-format: ^2.0.1
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    eslint-plugin-vuejs-accessibility: ^2.6.3
    jiti: ^2.7.0
    jscpd: ^5.4.2
    knip: ^6.42.1
    nano-staged: ^1.0.2
    simple-git-hooks: ^2.14.0
    typescript: ~6.0.3
    vue-tsc: ^3.3.13
  frontend:
    '@fontsource-variable/inter': ^5.3.0
    '@vueuse/core': ^15.0.0
    motion-v: ^2.8.0
    mygo-runtime: 0.5.5
    reka-ui: ^2.11.0
    vue: ^3.5.44
    vue-i18n: ^11.4.16
  icons:
    '@iconify-json/mingcute': ^1.2.8
  testing:
    '@vue/test-utils': ^2.5.1
    happy-dom: ^21.0.4
    vitest: ^5.0.5
