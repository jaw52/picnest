[install]
# Carried over from pnpm's default: only install versions published at
# least a day ago.
minimumReleaseAge = 86400
minimumReleaseAgeExcludes = [ "mygo-runtime" ]

[fmt]
# Only css/html/md/yml go through `bun fmt` (see the `fmt` script); ts/tsx/json
# stay with @antfu/eslint-config, whose stylistic rules disagree with it.
singleQuote = true
printWidth = 120
